<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>413 - حجم الطلب كبير جدًا</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#f8fafc; color:#0f172a; }
      .wrap { min-height: 70vh; display:flex; align-items:center; justify-content:center; padding: 32px 16px; }
      .card { width: min(680px, 100%); background:#fff; border-radius: 18px; box-shadow: 0 10px 30px rgba(2,6,23,.10); padding: 28px 22px; text-align:center; }
      .code { font-size: 56px; font-weight: 800; letter-spacing: 1px; color:#ef4444; margin: 0 0 10px; }
      h1 { font-size: 20px; margin: 0 0 10px; }
      p { margin: 0 0 16px; color:#334155; line-height: 1.7; }
      .hint { background:#f1f5f9; border-radius: 12px; padding: 12px 14px; color:#0f172a; font-size: 14px; }
      a { display:inline-block; margin-top: 16px; background:#0ea5e9; color:#fff; padding: 10px 14px; border-radius: 10px; text-decoration:none; font-weight: 600; }
      a:hover { filter: brightness(.95); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="code">413</div>
        <h1>تعذّر إكمال العملية لأن حجم البيانات المرسلة كبير جدًا</h1>
        <div class="hint">قلّل حجم الملف/الصور أو قسّم المحتوى، ثم حاول مرة أخرى.</div>
        <a href="/">العودة للصفحة الرئيسية</a>
      </div>
    </div>
  </body>
</html>
